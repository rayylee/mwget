[package]
name = "mwget"
version = "1.2.0"
edition = "2024"
description = "A multi-threaded wget implementation in Rust"
license = "LGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/rayylee/mwget"
homepage = "https://github.com/rayylee/mwget"
documentation = "https://github.com/rayylee/mwget"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
reqwest = { version = "0.13", features = ["stream", "rustls"], default-features = false }
clap = { version = "4.6", features = ["derive"] }
url = "2.5"
thiserror = "2.0"
futures = "0.3"
chrono = "0.4"
crossterm = "0.29"
scraper = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
